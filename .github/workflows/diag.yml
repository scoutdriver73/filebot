name: Diagnose data files
on:
  push:
    branches: [diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for f in query-blacklist release-groups moviedb thetvdb series-mappings anidb osdb; do
            curl -sS -L -A 'FileBot 4.8.0' -o $f.xz "https://app.filebot.net/data/$f.txt.xz"
            echo "::notice::$f size=$(stat -c%s $f.xz) content=[$(xz -dc $f.xz 2>&1 | head -c 300 | tr '\n' '|' )]"
          done
