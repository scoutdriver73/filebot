name: Diagnose data files
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          out=diag-result.txt; : > $out
          for f in release-groups query-blacklist series-mappings moviedb thetvdb anidb osdb; do
            u="https://app.filebot.net/data/$f.txt.xz"
            code=$(curl -sS -L -o "$f.xz" -w "%{http_code} %{size_download} %{content_type} %{remote_ip}" -A 'FileBot 4.8.0' "$u" 2>&1; echo " exit=$?")
            echo "== $f: $code" >> $out
            curl -sS -I -A 'FileBot 4.8.0' "$u" | grep -iE '^(last-modified|date|server)' >> $out || true
            if xz -t "$f.xz" 2>/dev/null; then
              echo "lines: $(xz -dc $f.xz | wc -l)" >> $out
              xz -dc "$f.xz" | head -3 >> $out
              [ "$f" = moviedb ] && { echo "odyssey matches:"; xz -dc $f.xz | grep -i 'odyssey' | tail -5; echo "max year:"; xz -dc $f.xz | awk -F'\t' '{print $4}' | grep -E '^[0-9]{4}$' | sort -n | tail -1; } >> $out
            else
              echo "not valid xz; first bytes:" >> $out; head -c 300 "$f.xz" >> $out; echo >> $out
            fi
          done
          grep -E '^(==|lines|last-modified)' $out | tr '\n' '|' | cut -c1-3000 | sed 's/^/::notice::/'
          echo
          grep -A8 'odyssey matches' $out | tr '\n' '|' | sed 's/^/::notice::/'
          echo
          grep -A3 'not valid' $out | tr '\n' '|' | cut -c1-1500 | sed 's/^/::notice::/'
